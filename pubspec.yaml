name: asatezah
description: "أساتذة - مكتبة رقمية تعليمية"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  google_generative_ai: ^0.4.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # File Handling & Media
  file_picker: ^13.1.0
  open_filex: ^5.0.0
  image_picker: ^1.1.2
  cached_network_image: ^4.0.4
  flutter_rating_bar: ^4.0.1
  cupertino_icons: ^2.0.0

  # Network & Storage
  http: ^1.2.2
  flutter_secure_storage: ^10.3.4
  shared_preferences: ^2.3.2
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^7.3.2
  google_fonts: ^9.0.0
  shimmer: ^4.0.0

  # System & Device
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  intl: ^0.20.3
  path: ^1.9.1
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  widgetbook: ^3.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
