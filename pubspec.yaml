name: asatezah
description: "أساتذة - مكتبة رقمية تعليمية"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # File Handling & Media
  file_picker: ^8.1.7
  open_filex: ^4.5.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  cupertino_icons: ^1.0.8

  # Network & Storage
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^6.0.5

  # System & Device
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
