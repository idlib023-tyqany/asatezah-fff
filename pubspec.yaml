name: asatezah
description: "أساتذة - مكتبة رقمية تعليمية"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  open_filex: ^4.0.0
  flutter:
    sdk: flutter
  file_picker: 13.1.0
  flutter_localizations:
    sdk: flutter

  # UI & Media
  cupertino_icons: ^1.0.8
  cached_network_image: ^4.0.2
  flutter_rating_bar: ^4.0.1

  # Network & Storage
  http: ^1.2.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.0
  flutter_cache_manager: ^3.3.0
  connectivity_plus: ^7.3.1

  # System & Device
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  image_picker: ^1.0.0
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
